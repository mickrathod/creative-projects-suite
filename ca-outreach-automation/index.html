    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-border: #1e293b;
      --surface-hover: #1a243d;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.3);
      --wa-green: #25d366;
      --wa-dark: #128c7e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --tag-high: #ef4444;
      --tag-med: #f59e0b;
      --tag-low: #64748b;
      --card-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-border);
    }

    .title-group h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-event {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--card-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 700;
      margin-top: 6px;
      color: #fff;
    }

    .stat-val.green { color: var(--wa-green); }
    .stat-val.blue { color: #60a5fa; }
    .stat-val.amber { color: #fbbf24; }

    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--card-radius);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
    }

    .search-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: #334155;
      border-color: #475569;
    }

    .btn-export {
      background: #1e3a8a;
      border-color: #2563eb;
    }
    .btn-export:hover {
      background: #2563eb;
    }

    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }

    .lead-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--card-radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .lead-card:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    .lead-card.status-sent {
      border-left: 4px solid var(--wa-green);
      background: #0d1e1f;
    }

    .lead-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .lead-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      display: inline-block;
    }

    .lead-name {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }

    .lead-designation {
      font-size: 12px;
      color: #94a3b8;
    }

    .priority-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;

    .priority-Medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .priority-Low { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    .lead-details {
      font-size: 13px;
      color: #cbd5e1;
      margin: 8px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-icon {
      color: #64748b;
      font-size: 13px;
      width: 16px;
    }

    .context-box {
      background: #0b1120;
      border: 1px dashed #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .message-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 12.5px;
      color: #e2e8f0;
      margin-bottom: 14px;
      position: relative;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }

    .btn-wa {
      background: var(--wa-dark);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;

      background: var(--wa-green);
      color: #0b0f19;
    }

      color: #64748b;
      cursor: not-allowed;

      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;

      border-radius: 8px;
      font-size: 12px;

      color: #fff;

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .leads-grid { grid-template-columns: 1fr; }
      .controls-panel { flex-direction: column; align-items: stretch; }

  </style>
</head>

    </div>

    <!-- Leads Grid -->
    <div class="leads-grid" id="leadsGrid"></div>
  </div>

  <script>
    let leadStatus = JSON.parse(localStorage.getItem('ca_outreach_status') || '{}');

    function saveStatus(leadId, status) {
      leadStatus[leadId] = status;
      localStorage.setItem('ca_outreach_status', JSON.stringify(leadStatus));
      renderStats();
      const card = document.getElementById(`card-${leadId}`);
      if (card) {
        card.className = `lead-card ${status === 'Sent' ? 'status-sent' : ''}`;
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast('📋 Message copied to clipboard!');
    }

    function renderStats() {
      const total = leads.length;
      let high = 0;
      let sent = 0;

      leads.forEach(l => {
        if (l.Lead_Priority === 'High') high++;
        if (leadStatus[l.Lead_ID] === 'Sent') sent++;
      });

      document.getElementById('total-count').innerText = total;
      document.getElementById('high-count').innerText = high;
      document.getElementById('sent-count').innerText = sent;
      document.getElementById('pending-count').innerText = total - sent;
    }

    function cleanPhone(raw) {
      if (!raw) return null;
      let digits = raw.replace(/[^0-9+]/g, '');
      if (!digits) return null;
      if (digits.startsWith('+')) digits = digits.substring(1);
      else if (digits.length === 10) digits = '91' + digits;
      else if (digits.length === 11 && digits.startsWith('0')) digits = '91' + digits.substring(1);
      return digits.length >= 10 ? digits : null;
    }

    function renderCards(list) {
      const grid = document.getElementById('leadsGrid');
      grid.innerHTML = '';

      list.forEach(lead => {
        const id = lead.Lead_ID;
        const currentStatus = leadStatus[id] || 'Pending';
        const cleanedPhone = cleanPhone(lead.Phone_Number);
        const hasPhone = Boolean(cleanedPhone);
        const encodedMsg = encodeURIComponent(lead.Tailored_Business_Outreach_Message || '');
        const waLink = hasPhone ? `https://api.whatsapp.com/send?phone=${cleanedPhone}&text=${encodedMsg}` : '#';

        const card = document.createElement('div');
        card.id = `card-${id}`;
        card.className = `lead-card ${currentStatus === 'Sent' ? 'status-sent' : ''}`;

        card.innerHTML = `
          <div>
            <div class="lead-header">
              <div>
                <span class="lead-id">${lead.Lead_ID}</span>
                <div class="lead-name">${escapeHtml(lead.Name)}</div>
                <div class="lead-designation">${escapeHtml(lead.Prefix_Designation || 'CA Professional')}</div>
              </div>
              <span class="priority-tag priority-${lead.Lead_Priority}">${lead.Lead_Priority}</span>
            </div>

            <div class="lead-details">
              ${lead.Firm_Company_Name ? `<div class="detail-row"><span class="detail-icon">🏢</span> <strong>${escapeHtml(lead.Firm_Company_Name)}</strong></div>` : ''}
              <div class="detail-row"><span class="detail-icon">📍</span> ${escapeHtml(lead.City_Location || 'India')}</div>
              <div class="detail-row"><span class="detail-icon">📞</span> ${escapeHtml(lead.Phone_Number || 'No Phone')}</div>
              ${lead.Email ? `<div class="detail-row"><span class="detail-icon">✉️</span> ${escapeHtml(lead.Email)}</div>` : ''}
            </div>

            ${lead.Key_Requirements_And_Context ? `<div class="context-box"><strong>Context:</strong> ${escapeHtml(lead.Key_Requirements_And_Context)}</div>` : ''}

            <div class="message-box">${escapeHtml(lead.Tailored_Business_Outreach_Message || '')}</div>
          </div>

          <div class="card-actions">
            ${hasPhone ? `
              <a href="${waLink}" target="_blank" class="btn-wa" onclick="markSent('${id}')">
                <span>💬 WhatsApp</span>
              </a>
            ` : `
              <span class="btn-wa disabled">No Phone</span>
            `}

            <button class="btn-copy" id="btn-copy-${id}">📋 Copy</button>

            <select class="status-select" onchange="saveStatus('${id}', this.value)">
              <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
              <option value="Sent" ${currentStatus === 'Sent' ? 'selected' : ''}>✅ Sent</option>
              <option value="Interested" ${currentStatus === 'Interested' ? 'selected' : ''}>🔥 Interested</option>
              <option value="Follow-Up" ${currentStatus === 'Follow-Up' ? 'selected' : ''}>🔄 Follow-Up</option>
            </select>
          </div>
        `;

        grid.appendChild(card);

        // Attach event listener for copy
        document.getElementById(`btn-copy-${id}`).addEventListener('click', () => {
          copyText(lead.Tailored_Business_Outreach_Message || '');
        });
      });
    }

    function markSent(leadId) {
      const select = document.querySelector(`#card-${leadId} .status-select`);
      if (select && select.value === 'Pending') {
        select.value = 'Sent';
        saveStatus(leadId, 'Sent');
      }
    }

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const priority = document.getElementById('priorityFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = leads.filter(l => {
        const id = l.Lead_ID;
        const currStatus = leadStatus[id] || 'Pending';

        const matchesQuery = !q ||
          l.Name.toLowerCase().includes(q) ||
          (l.Firm_Company_Name && l.Firm_Company_Name.toLowerCase().includes(q)) ||
          (l.City_Location && l.City_Location.toLowerCase().includes(q)) ||
          l.Lead_ID.toLowerCase().includes(q) ||
          (l.Phone_Number && l.Phone_Number.toLowerCase().includes(q));

        const matchesPriority = priority === 'ALL' || l.Lead_Priority === priority;
        const matchesStatus = status === 'ALL' || currStatus === status;

        return matchesQuery && matchesPriority && matchesStatus;
      });

      renderCards(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('priorityFilter').value = 'ALL';
      document.getElementById('statusFilter').value = 'ALL';
      renderCards(leads);
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function exportUpdatedCSV() {
      let csvContent = "data:text/csv;charset=utf-8,";
      const keys = Object.keys(leads[0]);
      const headers = [...keys, "Outreach_Status"];
      csvContent += headers.join(",") + "\n";

      leads.forEach(l => {
        const row = keys.map(k => '"' + (l[k] || "").replace(/"/g, '""') + '"');
        row.push('"' + (leadStatus[l.Lead_ID] || "Pending") + '"');
        csvContent += row.join(",") + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `CA_Outreach_Status_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Initial render
    renderStats();
    renderCards(leads);
  </script>
</body>
</html>
